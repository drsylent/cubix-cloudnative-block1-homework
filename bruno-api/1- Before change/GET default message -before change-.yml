info:
  name: GET default message -before change-
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/application/test

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res("message")
      operator: eq
      value: default

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
